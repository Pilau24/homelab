---
- name: Remove the superseded Traefik Quadlet
  ansible.builtin.file:
    path: /etc/containers/systemd/traefik.container
    state: absent
  notify: Restart Traefik

- name: Configure Traefik and generate its systemd unit
  containers.podman.podman_container:
    name: traefik
    image: "{{ podman_traefik.image }}"
    command: "{{ podman_traefik.command }}"
    publish:
      - "80:80"
      - "443:443"
    volume:
      - /run/podman/podman.sock:/var/run/docker.sock
    state: created
    generate_systemd:
      path: /etc/systemd/system
      new: true
      names: true
      no_header: true
      container_prefix: ""
      separator: ""
      restart_policy: always
      after:
        - podman.socket
      requires:
        - podman.socket
  notify: Restart Traefik

- name: Flush Traefik handlers
  ansible.builtin.meta: flush_handlers

- name: Start Traefik
  ansible.builtin.systemd:
    name: traefik.service
    enabled: true
    state: started
